name: Build tuic-server multi-arch Docker image

on:
  push:
    branches:
      - impl-1.0
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 设置 QEMU (支持跨架构编译)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 设置 Buildx (支持多架构)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 构建 amd64 镜像并导出
      - name: Build amd64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=docker,dest=./tuic-server-amd64.tar
          tags: tuic-server:amd64

      # 构建 arm64 镜像并导出
      - name: Build arm64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          outputs: type=docker,dest=./tuic-server-arm64.tar
          tags: tuic-server:arm64

      # 上传构建产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuic-server-docker-images
          path: |
            tuic-server-amd64.tar
            tuic-server-arm64.tar
